<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kelola ruangan | Peminjaman Ruangan</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../css/app.css">
</head>
<body>
  <div class="app">
    <aside id="sidebar"></aside>
    <div class="main">
      <header id="topbar"></header>
      <main id="content">
        <div class="head-row">
          <div>
            <h1>Kelola ruangan</h1>
            <p class="sub">Tambah, ubah, hapus, dan atur status ruangan.</p>
          </div>
          <button type="button" class="btn" id="addBtn">Tambah ruangan</button>
        </div>

        <section class="card" id="formCard" hidden aria-labelledby="formTitle">
          <h2 id="formTitle">Tambah ruangan</h2>
          <form id="roomForm" novalidate>
            <div class="form-grid">
              <label class="ctl">Nama ruangan
                <input type="text" id="fName" required>
              </label>
              <label class="ctl">Tipe
                <select id="fType"></select>
              </label>
              <label class="ctl">Lokasi
                <input type="text" id="fLocation" required>
              </label>
              <label class="ctl">Kapasitas (orang)
                <input type="number" id="fCapacity" step="1" required>
                <small class="hint" id="capHint"></small>
              </label>
              <label class="ctl span2">Fasilitas
                <input type="text" id="fFacilities">
                <small class="hint">Pisahkan dengan koma, misalnya: Papan tulis, AC, Wi-Fi.</small>
              </label>
              <label class="ctl span2">URL foto (opsional)
                <input type="text" id="fPhoto" placeholder="https://...">
                <small class="hint">Kosongkan untuk memakai foto placeholder.</small>
              </label>
            </div>
            <p class="notice" id="formNotice" role="alert"></p>
            <div class="actions">
              <button type="submit" class="btn">Simpan</button>
              <button type="button" class="btn alt" id="cancelBtn">Batal</button>
            </div>
          </form>
        </section>

        <div class="toolbar stack-top">
          <div class="tabs" id="tabs">
            <button type="button" class="tab" data-f="semua" aria-pressed="true">Semua</button>
            <button type="button" class="tab" data-f="aktif" aria-pressed="false">Aktif</button>
            <button type="button" class="tab" data-f="nonaktif" aria-pressed="false">Nonaktif</button>
          </div>
        </div>

        <section class="card">
          <div class="tbl-wrap">
            <table>
              <thead>
                <tr><th>Ruangan</th><th>Tipe</th><th>Kapasitas</th><th>Fasilitas</th><th>Booking aktif</th><th>Status</th><th>Aksi</th></tr>
              </thead>
              <tbody id="rows"></tbody>
            </table>
          </div>
          <p class="notice" id="notice" role="status"></p>
        </section>
      </main>
    </div>
  </div>

  <script src="../../js/config.js"></script>
  <script src="../../js/api-client.js"></script>
  <script src="../../js/auth-service.js"></script>
  <script src="../../js/api.js"></script>
  <script src="../../js/layout.js"></script>
  <script src="../../js/kelola-ruangan.js"></script>
</body>
</html>
