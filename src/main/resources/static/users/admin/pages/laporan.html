<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Laporan penggunaan | Peminjaman Ruangan</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../css/app.css">
</head>
<body>
  <div class="app">
    <aside id="sidebar"></aside>
    <div class="main">
      <header id="topbar"></header>
      <main id="content">
        <h1>Laporan penggunaan ruangan</h1>
        <p class="sub">Ringkasan total booking, pembatalan, dan no-show per ruangan.</p>

        <div class="toolbar">
          <div class="tabs" id="tabs">
            <button type="button" class="tab" data-p="harian" aria-pressed="true">Harian</button>
            <button type="button" class="tab" data-p="mingguan" aria-pressed="false">Mingguan</button>
            <button type="button" class="tab" data-p="bulanan" aria-pressed="false">Bulanan</button>
          </div>
          <button type="button" class="btn alt" id="csvBtn">Unduh CSV</button>
        </div>

        <section class="card" aria-labelledby="tblTitle">
          <h2 id="tblTitle">Penggunaan per ruangan</h2>
          <p class="range" id="range"></p>
          <div class="tbl-wrap">
            <table>
              <thead>
                <tr>
                  <th>Ruangan</th><th>Tipe</th>
                  <th class="num">Total booking</th><th class="num">Selesai</th><th class="num">Aktif</th>
                  <th class="num">Dibatalkan</th><th class="num">No-show</th>
                </tr>
              </thead>
              <tbody id="rows"></tbody>
              <tfoot id="foot"></tfoot>
            </table>
          </div>
          <p class="muted">Dibatalkan mencakup pembatalan oleh mahasiswa, sistem (no-show), dan admin. No-show adalah bagian dari kolom Dibatalkan.</p>
          <p class="notice" id="notice" role="status"></p>
        </section>
      </main>
    </div>
  </div>

  <script src="../../js/config.js"></script>
  <script src="../../js/api-client.js"></script>
  <script src="../../js/auth-service.js"></script>
  <script src="../../js/api.js"></script>
  <script src="../../js/layout.js"></script>
  <script src="../../js/laporan.js"></script>
</body>
</html>
