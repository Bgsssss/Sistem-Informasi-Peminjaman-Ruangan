<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Profil | Peminjaman Ruangan</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/app.css">
</head>
<body>
  <div class="app">
    <aside id="sidebar"></aside>
    <div class="main">
      <header id="topbar"></header>
      <main id="content">
        <h1>Profil</h1>
        <p class="sub">Data diri, trust score, dan riwayat pelanggaran kamu.</p>

        <div class="grid">
          <section class="card" aria-labelledby="scoreTitle">
            <h2 id="scoreTitle">Trust score</h2>
            <div class="score"><span id="score">-</span><small> / <span id="scoreMax">100</span></small></div>
            <div class="bar" role="img" aria-label="Trust score"><i id="scoreBar"></i></div>
            <p class="muted" id="scoreLabel"></p>
            <p class="muted rules" id="rules"></p>
          </section>

          <section class="card" aria-labelledby="infoTitle">
            <h2 id="infoTitle">Data diri</h2>
            <dl id="info"></dl>
          </section>
        </div>

        <div class="stack">
          <section class="card" aria-labelledby="histTitle">
            <h2 id="histTitle">Riwayat trust score</h2>
            <div class="tbl-wrap">
              <table>
                <thead><tr><th>Waktu</th><th>Keterangan</th><th>Perubahan</th><th>Skor akhir</th></tr></thead>
                <tbody id="scoreRows"></tbody>
              </table>
            </div>
          </section>

          <section class="card" aria-labelledby="vioTitle">
            <h2 id="vioTitle">Riwayat pelanggaran</h2>
            <ul class="list" id="violations"></ul>
          </section>

          <section class="card" aria-labelledby="pwTitle">
            <h2 id="pwTitle">Ganti kata sandi</h2>
            <form id="pwForm" class="form" novalidate>
              <label class="ctl">Kata sandi saat ini
                <input type="password" id="pwCurrent" autocomplete="current-password" required>
              </label>
              <label class="ctl">Kata sandi baru
                <input type="password" id="pwNew" autocomplete="new-password" required>
              </label>
              <label class="ctl">Ulangi kata sandi baru
                <input type="password" id="pwConfirm" autocomplete="new-password" required>
              </label>
              <button type="submit" class="btn">Simpan kata sandi</button>
              <p class="notice" id="pwNotice" role="status"></p>
            </form>
          </section>
        </div>
      </main>
    </div>
  </div>

  <script src="../js/config.js"></script>
  <script src="../js/api-client.js"></script>
  <script src="../js/auth-service.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/layout.js"></script>
  <script src="../js/profil.js"></script>
</body>
</html>
