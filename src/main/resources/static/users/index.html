<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Masuk | Peminjaman Ruangan</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="shell">

    <section class="panel">
      <form id="loginForm" novalidate>
        <h1>Masuk</h1>

        <div class="field">
          <label for="username">Email / NPM</label>
          <input id="username" name="username" type="text" autocomplete="username" autofocus required>
        </div>

        <div class="field">
          <label for="password">Kata sandi</label>
          <div class="pass">
            <input id="password" name="password" type="password" autocomplete="current-password" required>
            <button type="button" id="togglePass" class="ghost" aria-pressed="false">Tampilkan</button>
          </div>
        </div>

        <p id="error" class="error" role="alert"></p>

        <button type="submit" class="primary" id="submitBtn">Masuk</button>
      </form>
    </section>
  </main>

  <script src="js/config.js"></script>
  <script src="js/api-client.js"></script>
  <script src="js/auth-service.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
