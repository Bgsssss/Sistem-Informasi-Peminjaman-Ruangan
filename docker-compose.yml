# (lokal): MySQL 8 + aplikasi Spring Boot (frontend statis ikut di dalam jar) + nginx reverse proxy.
# Hanya "nginx" yang membuka port ke komputer Anda.
name: rpl

services:
  db:
    image: mysql:8.4
    container_name: rpl-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      TZ: Asia/Jakarta
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+07:00
    volumes:
      - db_data:/var/lib/mysql
      # Skrip .sql di folder ini dijalankan SEKALI, saat volume db_data masih kosong.
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    networks: [internal]
    # Untuk membuka database dari Workbench/DBeaver di komputer Anda, hapus tanda # di bawah:
    # ports:
    #   - "127.0.0.1:3307:3306"

  app:
    build:
      context: .
      args:
        JAVA_VERSION: ${JAVA_VERSION:-25}
    image: rpl-app:latest
    container_name: rpl-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      TZ: Asia/Jakarta
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/${DB_NAME:-rpl}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Jakarta
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-rpl_app}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      # Percayai header X-Forwarded-* dari nginx.
      SERVER_FORWARD_HEADERS_STRATEGY: framework
      # Admin pertama. Awalan RPL_ mengikuti application.yml (rpl.bootstrap.*); ganti bila prefix Anda berbeda.
      # Kunci JWT dibaca dari folder ./keys di host (tidak ikut masuk ke image).
      APP_SECURITY_JWT_PRIVATE_KEY_PATH: file:/app/keys/private_key.pem
      APP_SECURITY_JWT_PUBLIC_KEY_PATH: file:/app/keys/public_key.pem
      RPL_BOOTSTRAP_ADMIN_USERNAME: ${ADMIN_USERNAME}
      RPL_BOOTSTRAP_ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    volumes:
      - ./keys:/app/keys:ro
    expose:
      - "8080"
    networks: [internal]

  nginx:
    image: nginx:1.27-alpine
    container_name: rpl-nginx
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${WEB_PORT:-80}:80"
    networks: [internal]

volumes:
  db_data:

networks:
  internal: