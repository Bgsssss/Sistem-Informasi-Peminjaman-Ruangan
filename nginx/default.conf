# nginx sebagai reverse proxy ke aplikasi Spring Boot (yang juga menyajikan frontend statis).

limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/m;
limit_req_status 429;

# Alamat bersih -> file HTML di Spring Boot
map $uri $page_file {
    /login             /users/index.html;
    /dashboard         /users/pages/dashboard-mahasiswa.html;
    /booking           /users/pages/booking.html;
    /rooms/detail      /users/pages/detail-ruangan.html;
    /history           /users/pages/riwayat.html;
    /check-in          /users/pages/checkin.html;
    /profile           /users/pages/profil.html;
    /admin/dashboard   /users/admin/pages/dashboard.html;
    /admin/rooms       /users/admin/pages/kelola-ruangan.html;
    /admin/students    /users/admin/pages/kelola-mahasiswa.html;
    /admin/bookings    /users/admin/pages/kelola-booking.html;
    /admin/violations  /users/admin/pages/log-pelanggaran.html;
    /admin/reports     /users/admin/pages/laporan.html;
    /admin/settings    /users/admin/pages/pengaturan.html;
    default            "";
}

# Nama file .html lama -> alamat bersih (untuk link relatif yang masih memakai .html)
map $legacy_page $legacy_clean {
    index                /login;
    dashboard-mahasiswa  /dashboard;
    booking              /booking;
    detail-ruangan       /rooms/detail;
    riwayat              /history;
    checkin              /check-in;
    profil               /profile;
    dashboard            /admin/dashboard;
    kelola-ruangan       /admin/rooms;
    kelola-mahasiswa     /admin/students;
    kelola-booking       /admin/bookings;
    log-pelanggaran      /admin/violations;
    laporan              /admin/reports;
    pengaturan           /admin/settings;
    default              "";
}

upstream app_backend {
    server app:8080;
    keepalive 16;
}

server {
    listen 80;
    server_name _;
    server_tokens off;

    client_max_body_size 5m;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header X-Forwarded-Port  $server_port;
    proxy_set_header Connection        "";
    proxy_connect_timeout 5s;
    proxy_send_timeout    60s;
    proxy_read_timeout    60s;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = / {
        return 302 /login;
    }

    # Alamat .html lama (termasuk link relatif seperti booking.html) -> redirect ke alamat bersih
    location ~ ^/(?:users/|admin/|rooms/|pages/)*(?<legacy_page>[a-z-]+)\.html$ {
        if ($legacy_clean = "") { return 404; }
        return 301 $legacy_clean$is_args$args;
    }

    # File JS dan CSS (path relatif dari halaman bersih jatuh ke /js/ dan /css/)
    location ~ ^/(?:js|css)/ {
        rewrite ^/(.*)$ /users/$1 break;
        proxy_pass http://app_backend;
    }

    location ~ ^/api(?:/v1)?/auth/(?:login|refresh)$ {
        limit_req zone=auth_limit burst=10 nodelay;
        proxy_pass http://app_backend;
    }

    # Halaman bersih dilayani dari file .html-nya; selain itu diteruskan apa adanya (/api, swagger, dst.)
    location / {
        if ($page_file != "") {
            rewrite ^ $page_file break;
        }
        proxy_pass http://app_backend;
    }
}