# nginx sebagai reverse proxy ke aplikasi Spring Boot (yang juga menyajikan frontend statis).

# Pembatas laju untuk endpoint autentikasi (anti tebak password): 10 permintaan per menit per IP.
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/m;
limit_req_status 429;

upstream app_backend {
    server app:8080;
    keepalive 16;
}

server {
    listen 80;
    server_name _;
    server_tokens off;

    client_max_body_size 5m;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Pengaturan proxy (diwarisi semua location di bawah)
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header X-Forwarded-Port  $server_port;
    proxy_set_header Connection        "";
    proxy_connect_timeout 5s;
    proxy_send_timeout    60s;
    proxy_read_timeout    60s;

    # Health check nginx sendiri
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Endpoint autentikasi: dibatasi lajunya (cocok dengan /api/auth/... dan /api/v1/auth/...)
    location ~ ^/api(?:/v1)?/auth/(?:login|refresh)$ {
        limit_req zone=auth_limit burst=10 nodelay;
        proxy_pass http://app_backend;
    }

    # Frontend ada di /users/ (tidak ada static/index.html di root), jadi arahkan "/" ke halaman login.
    location = / {
        return 302 /users/index.html;
    }

    # Semua lainnya (frontend statis, /api, dst.) diteruskan ke Spring Boot
    location / {
        proxy_pass http://app_backend;
    }
}